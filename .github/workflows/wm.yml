name: Update wm

# Follows the latest release of g4rcez/wm: when it is newer than the formula, this bumps Formula/wm.rb.
# It runs in this repo with its own GITHUB_TOKEN, so the wm repo needs no token.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bump the formula to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag="$(gh api repos/g4rcez/wm/releases/latest --jq .tag_name 2>/dev/null)"; then echo "wm has no release yet"; exit 0; fi
          version="${tag#v}"
          if grep -q "/tags/${tag}.tar.gz" Formula/wm.rb; then echo "wm is already at $version"; exit 0; fi
          url="https://github.com/g4rcez/wm/archive/refs/tags/${tag}.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          sed -i -e "s#^  url \".*\"#  url \"$url\"#" -e "s#^  sha256 \".*\"#  sha256 \"$sha\"#" Formula/wm.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wm.rb
          git commit -m "wm $version"
          git push
